name: Build Tenda BE12 Pro (BE7200 Ultra) OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ openwrt-24.10-6.6 ]
    paths:
      - '.github/workflows/build-tenda-be12pro.yml'
      - 'tenda-be12pro.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
  schedule:
    - cron: '0 18 * * 0'   # 每周日 18:00 UTC 自动追新（不需要就删掉这行）

env:
  # ⚠️ 关键修正：必须指向“含 tenda_be12-pro 设备定义”的上游，否则 make defconfig 会静默丢弃
  #    你的设备 target，回落到上游唯一的其它 filogic 设备（如 abt_asr3000），编译出错误固件。
  #    已核实 kalicyh/ImmortalWrt-tenda_be12-pro 的 filogic.mk:361 有完整 Device/tenda_be12-pro
  #    （DEVICE_DTS := mt7987a-tenda-be12-pro，且含 Build/tenda-mkdualimageheader 双镜像头），
  #    padavanonly/immortalwrt-mt798x-6.6 不含此设备，故不能用。
  REPO_URL: https://github.com/kalicyh/ImmortalWrt-tenda_be12-pro
  REPO_BRANCH: tenda-be12-pro
  CONFIG_FILE: tenda-be12pro.config
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y $(curl -fsSL https://is.gd/depend_ubuntu2204_openwrt)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source
        run: |
          df -hT "$GITHUB_WORKSPACE"
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

      # ===== 软件源码下载缓存：二次编译省去向国外服务器重复下载数 GB tarball =====
      # 作用：第一次跑（缓存未命中）照常下载并落盘；之后每改配置重编，
      #       actions/cache 会把上次的 openwrt/dl 直接还原，make download 跳过已存在的包，
      #       仅补下载新增/变更的包，通常省 15~20 分钟。
      # 注意：① 首次构建无加速（必然先 miss）；② 缓存按仓库隔离，存在本 fork 仓库里；
      #      ③ 单仓库缓存上限约 10GB，dl 过大时 save 会告警但不致命；下方 Trim 步骤为其瘦身。
      # key 用 feeds.conf.default 内容哈希：上游未改 feeds 时 key 固定 → 直接命中；
      #       上游更新 feeds 后 key 变化，仍可由 restore-keys 复用旧缓存再增量补齐。
      - name: Cache dl (software source download cache)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-tenda-be12pro-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-tenda-be12pro-

      - name: Load .config
        run: |
          [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

      - name: Run diy-part1.sh (add custom sources)
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Update & install feeds
        run: |
          cd openwrt
          # GitHub Actions 克隆 luci/packages 大仓库易网络抖动，重试 3 次
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then
              echo "feeds update 成功（第 $i 次）"
              break
            fi
            echo "feeds update 失败，第 $i 次重试..."
            sleep 8
          done
          ./scripts/feeds install -a || true
          # 仅做总览统计：feeds install 创建的是软链接 package/feeds/<feed>/<pkg>，需跟 symlink 统计，否则永远 0
          total_sym=$(ls -d package/feeds/*/* 2>/dev/null | wc -l)
          echo "📊 feeds 已注册包总数（symbolic link）: $total_sym  (拉全正常应 >3000；<1500 即网络问题)"
          if [ "$total_sym" -lt 1500 ]; then
            echo "❌ feeds 拉取明显不全，重跑通常可解决。"
            exit 1
          fi

      - name: Run diy-part2.sh (default settings)
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Defconfig & verify packages
        run: |
          cd openwrt
          make defconfig
          echo "===== 校验：目标设备是否被识别 ====="
          if grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_tenda_be12-pro=y" .config; then
            echo "OK   DEVICE tenda_be12-pro"
          else
            echo "MISS DEVICE tenda_be12-pro  <-- 该分支未含此设备！请把上方 env 的 REPO_URL 改为 https://github.com/kalicyh/ImmortalWrt-tenda_be12-pro、REPO_BRANCH 改为 tenda-be12-pro"
          fi
          echo "===== 校验：被静默丢弃的包（post-defconfig 权威）====="
          # 注：luci-app-tailscale / luci-app-adguardhome / luci-app-wireguard 均为 24.10 默认源不含的包——
          #   tailscale/adguardhome 后端二进制已直接 =y 编入；wireguard UI 由 luci-proto-wireguard 提供
          ok_list="" ; warn_list="" ; miss_list=""
          for p in luci-app-passwall xray-core adguardhome tailscale wireguard-tools luci-proto-wireguard luci-proto-ppp luci-app-ddns ddns-scripts-cloudflare luci-app-upnp luci-app-wol luci-app-ttyd openssh-sftp-server luci-theme-argon ca-certificates kmod-mediatek_hnat cron; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "OK   $p"
              ok_list="$ok_list $p"
            else
              # 子包/变体：在 OpenWrt 里大多通过 DEPENDS 自动带父包，defconfig 找不着单独的名字时不算缺包
              case "$p" in
                ddns-scripts-cloudflare|openssh-sftp-server)
                  echo "WARN $p  (子包，defconfig 未单独列出但会由父包 ddns-scripts/openssh 一起编入 — 非缺包)"
                  warn_list="$warn_list $p" ;;
                kmod-mediatek_hnat)
                  echo "WARN $p  (OpenWrt 核心内核模块，不在 feeds 中；由 OpenWrt 主树直接提供)"
                  warn_list="$warn_list $p" ;;
                *)
                  # 关键诊断：MISS 时直接在 feeds 索引里搜这个包，看它在不在 / 哪个 feed 下
                  feed_match="$(./scripts/feeds list 2>/dev/null | grep -E "^${p}\b" | head -1)"
                  if [ -n "$feed_match" ]; then
                    echo "MISS $p  <-- 在 feeds 索引中有 = '${feed_match}'，但 defconfig 仍然丢弃。意味着：依赖链上某个包被 defconfig 解析失败"
                  else
                    echo "MISS $p  <-- feeds 索引里完全没有（feed 未拉取或包不存在于任何已配置的 feed）。请检查 feeds.conf.default 是否含此 feed"
                  fi
                  miss_list="$miss_list $p" ;;
              esac
            fi
          done
          # 汇总：失败时一眼看出全部 MISS，无需上下滚动找
          echo ""
          echo "===== 汇总 ====="
          echo "OK   ($(echo $ok_list  | wc -w)):$ok_list"
          echo "WARN ($(echo $warn_list | wc -w)):$warn_list"
          echo "MISS ($(echo $miss_list | wc -w)):$miss_list"
          if [ -n "$miss_list" ]; then
            echo ""
            echo "❌ 以下包被 make defconfig 丢弃，构建已终止：$miss_list"
            echo "诊断指引："
            echo "  - 若 MISS 行的"在 feeds 索引中有"分支：包其实在 feeds 里，但 defconfig 因其依赖链上某包解析失败而丢。补全缺失的依赖，或显式 .config 加上。"
            echo "  - 若 MISS 行的"feeds 索引里完全没有"分支：该包不在当前任何 feed 索引中，需："
            echo "    ① 把含此包的额外 feed 加进 feeds.conf.default（参考 diy-part1.sh 的 passwall / passwall_packages）"
            echo "    ② 或显式 .config 改用既有包替代"
            exit 1
          fi
          echo "✅ 全家桶校验通过（含子包），继续编译"

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 编译完成后裁剪 dl：只保留当前配置仍在用的 tarball，删掉旧版本，给缓存瘦身避免撞 10GB 上限
      - name: Trim dl cache
        if: always()
        run: |
          [ -d openwrt ] && cd openwrt && { [ -x ./scripts/dl_cleanup.py ] && ./scripts/dl_cleanup.py all || true; } || true

      - name: Check image size
        run: |
          cd openwrt/bin/targets/*/*
          echo "===== 产物大小 ====="
          ls -lh *tenda_be12-pro* || true
          echo "本机 ubi/rootfs 分区上限 ≈ 90MB（flash layout 0xd80000-0x6780000）。若产物逼近/超过或报 'Image too big'："
          echo "降体积优先级：① 砍 Tailscale（已保留 WireGuard，可替代异地组网）"
          echo "            ② 砍 AdGuard Home（改由群晖 DS220+ 的 Docker 承载，路由 DNS 指过去）"
          echo "            ③ 砍 PassWall（仅留基础 LuCI）"

      - name: Organize files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true'
        with:
          tag_name: tenda-be12pro-${{ env.DATE }}
          name: Tenda BE12 Pro ${{ env.DATE }}
          files: "${{ env.FIRMWARE_PATH }}/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
