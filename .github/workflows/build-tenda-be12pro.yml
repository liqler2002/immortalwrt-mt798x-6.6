name: Build Tenda BE12 Pro (BE7200 Ultra) OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ openwrt-24.10-6.6 ]
    paths:
      - '.github/workflows/build-tenda-be12pro.yml'
      - 'tenda-be12pro.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
  schedule:
    - cron: '0 18 * * 0'   # 每周日 18:00 UTC 自动追新（不需要就删掉这行）

env:
  # ⚠️ 关键修正：必须指向“含 tenda_be12-pro 设备定义”的上游，否则 make defconfig 会静默丢弃
  #    你的设备 target，回落到上游唯一的其它 filogic 设备（如 abt_asr3000），编译出错误固件。
  #    已核实 kalicyh/ImmortalWrt-tenda_be12-pro 的 filogic.mk:361 有完整 Device/tenda_be12-pro
  #    （DEVICE_DTS := mt7987a-tenda-be12-pro，且含 Build/tenda-mkdualimageheader 双镜像头），
  #    padavanonly/immortalwrt-mt798x-6.6 不含此设备，故不能用。
  REPO_URL: https://github.com/kalicyh/ImmortalWrt-tenda_be12-pro
  REPO_BRANCH: tenda-be12-pro
  CONFIG_FILE: tenda-be12pro.config
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y $(curl -fsSL https://is.gd/depend_ubuntu2204_openwrt)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source
        run: |
          df -hT "$GITHUB_WORKSPACE"
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt

      # ===== 软件源码下载缓存：二次编译省去向国外服务器重复下载数 GB tarball =====
      # 作用：第一次跑（缓存未命中）照常下载并落盘；之后每改配置重编，
      #       actions/cache 会把上次的 openwrt/dl 直接还原，make download 跳过已存在的包，
      #       仅补下载新增/变更的包，通常省 15~20 分钟。
      # 注意：① 首次构建无加速（必然先 miss）；② 缓存按仓库隔离，存在本 fork 仓库里；
      #      ③ 单仓库缓存上限约 10GB，dl 过大时 save 会告警但不致命；下方 Trim 步骤为其瘦身。
      # key 用 feeds.conf.default 内容哈希：上游未改 feeds 时 key 固定 → 直接命中；
      #       上游更新 feeds 后 key 变化，仍可由 restore-keys 复用旧缓存再增量补齐。
      - name: Cache dl (software source download cache)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-tenda-be12pro-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            dl-tenda-be12pro-

      - name: Load .config
        run: |
          [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

      - name: Run diy-part1.sh (add custom sources)
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== 强制确认全家桶已安装（feeds 缺失即中断，避免静默丢包）====="
          for p in luci-app-passwall xray-core adguardhome tailscale wireguard-tools luci-proto-wireguard luci-proto-ppp luci-app-ddns ddns-scripts-cloudflare luci-app-upnp luci-app-wol luci-app-ttyd openssh-sftp-server luci-theme-argon ca-certificates kmod-mediatek_hnat cron; do
            if ./scripts/feeds install "$p" >/dev/null 2>&1; then
              echo "OK   install $p"
            else
              echo "FAIL install $p  <-- feeds 中找不到该包，构建前中断！请检查 feeds.conf.default / 目标分支"
              exit 1
            fi
          done

      - name: Run diy-part2.sh (default settings)
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Defconfig & verify packages
        run: |
          cd openwrt
          make defconfig
          echo "===== 校验：目标设备是否被识别 ====="
          if grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_tenda_be12-pro=y" .config; then
            echo "OK   DEVICE tenda_be12-pro"
          else
            echo "MISS DEVICE tenda_be12-pro  <-- 该分支未含此设备！请把上方 env 的 REPO_URL 改为 https://github.com/kalicyh/ImmortalWrt-tenda_be12-pro、REPO_BRANCH 改为 tenda-be12-pro"
          fi
          echo "===== 校验：被静默丢弃的包 ====="
          # turboacc 在 padavanonly fork 叫 -mtk，旧/通用 fork 叫 luci-app-turboacc，两者其一即可
          turboacc_ok=false
          for t in luci-app-turboacc-mtk luci-app-turboacc; do
            if grep -q "^CONFIG_PACKAGE_${t}=y" .config; then
              echo "OK   $t"
              turboacc_ok=true
            fi
          done
          [ "$turboacc_ok" = false ] && echo "MISS luci-app-turboacc / -mtk  <-- 该包不在 feeds，请加源或删除对应行"
          echo "（注：luci-app-tailscale / luci-app-adguardhome / luci-app-wireguard 均为 24.10 默认源不含的包——"
          echo "  tailscale/adguardhome 后端二进制已直接 =y 编入；wireguard UI 由 luci-proto-wireguard 提供，无需其 luci app）"
          fam_missing=0
          for p in luci-app-passwall luci-app-ddns ddns-scripts-cloudflare luci-theme-argon luci-app-wol luci-app-ttyd openssh-sftp-server luci-proto-wireguard luci-proto-ppp ca-certificates tailscale adguardhome xray-core kmod-mediatek_hnat cron; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "OK   $p"
            else
              echo "MISS $p  <-- make defconfig 后该包被丢弃（feeds 未装或依赖缺失），构建前中断！"
              fam_missing=1
            fi
          done
          if [ "$fam_missing" -ne 0 ]; then
            echo "❌ 全家桶校验未通过，已终止构建。请检查 feeds.conf.default 与目标分支是否含这些包。"
            exit 1
          fi
          echo "✅ 全家桶全部 =y，继续编译"

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 编译完成后裁剪 dl：只保留当前配置仍在用的 tarball，删掉旧版本，给缓存瘦身避免撞 10GB 上限
      - name: Trim dl cache
        if: always()
        run: |
          [ -d openwrt ] && cd openwrt && { [ -x ./scripts/dl_cleanup.py ] && ./scripts/dl_cleanup.py all || true; } || true

      - name: Check image size
        run: |
          cd openwrt/bin/targets/*/*
          echo "===== 产物大小 ====="
          ls -lh *tenda_be12-pro* || true
          echo "本机 ubi/rootfs 分区上限 ≈ 90MB（flash layout 0xd80000-0x6780000）。若产物逼近/超过或报 'Image too big'："
          echo "降体积优先级：① 砍 Tailscale（已保留 WireGuard，可替代异地组网）"
          echo "            ② 砍 AdGuard Home（改由群晖 DS220+ 的 Docker 承载，路由 DNS 指过去）"
          echo "            ③ 砍 PassWall（仅留基础 LuCI）"

      - name: Organize files
        id: organize
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "DATE=$(date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true'
        with:
          tag_name: tenda-be12pro-${{ env.DATE }}
          name: Tenda BE12 Pro ${{ env.DATE }}
          files: "${{ env.FIRMWARE_PATH }}/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
